name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (typecheck + emit)
        run: npm run build

      - name: Test
        run: npm test

      - name: Package
        run: npm pack

      - name: Consumer smoke test (install tarball, require + import)
        shell: bash
        run: |
          set -euxo pipefail
          TARBALL=$(ls zelthr*.tgz | head -n1)
          TMP=$(mktemp -d)
          cp "$TARBALL" scripts/consumer-smoke/smoke.cjs scripts/consumer-smoke/smoke.mjs test/test1.jpg "$TMP/"
          cd "$TMP"
          npm init -y >/dev/null
          # Allow native install scripts so onnxruntime/sharp are fully set up.
          node -e "const fs=require('fs');const p=require('./package.json');p.allowScripts={sharp:true,'onnxruntime-node':true,'tesseract.js':true};fs.writeFileSync('./package.json',JSON.stringify(p,null,2))"
          npm install "./$TARBALL" --no-audit --no-fund --ignore-scripts=false >/dev/null
          node smoke.cjs
          node smoke.mjs

  publish:
    name: Publish to npm (OIDC trusted publishing)
    # Publish ONLY on version tags (v*). Never on branch pushes or PRs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; Node 24 ships
      # an npm that supports it, but pin latest to be safe.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # dist/ is gitignored and not in the repo — npm publish packs ./dist,
      # so it must be built before publishing.
      - name: Build
        run: npm run build

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="v$(node -p "require('./package.json').version")"
          test "$TAG" = "$VERSION" || { echo "tag ($TAG) does not match package.json version ($VERSION)"; exit 1; }

      # No NODE_AUTH_TOKEN and no registry-url here on purpose: with a token
      # present (even empty), npm skips OIDC and tries legacy auth instead.
      - name: Publish to npm
        run: npm publish --provenance --access public